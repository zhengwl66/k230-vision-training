name: Project checks
on: [push, pull_request]
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 numpy==2.2.6 PyYAML==6.0.2
      - run: python -m compileall -q training deployment tests
      - run: python -m unittest discover -s tests -v
